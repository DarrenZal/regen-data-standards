id: Entity
name: Entity
prefixes:
  linkml: https://w3id.org/linkml/
  rfs: https://framework.regen.network/schema/

imports:
  - linkml:types
  - core

default_prefix: rfs
default_range: string

classes:
  Entity:
    slots:
      - name
      - description
      - url
      - image
    slot_usage:
      name:
        required: true
    attributes:
      type:
        range: EntityTypes
        required: true
      rid:
        slot_uri: rfs:rid
        description: >-
          Stable, resolvable identifier for this Entity — a KOI entity URI or an
          ORN RID (e.g. "orn:regen.entity:wsanec-leadership-council"). This is the
          target that a reference-style slot resolves against.

          WHY THIS EXISTS: as the schema moves from inlining Entities to
          referencing them (see the claimRefs / attestationRefs change in the
          Output Record Contract, PR #55), a `uriorcurie` reference needs
          something to point AT. Today Entity has only name, type and
          walletAddress — so a reference can be written but never resolved, and
          two Entities are distinguishable only by display name.

          OPTIONAL, DELIBERATELY. Making this an `identifier: true` slot would be
          correct but is a breaking change: Entity is inlined by Claim (x2),
          Attestation, and ProjectInfo (x6), and every existing instance omits it.
          The intended path is: emitters begin populating rid -> instances are
          backfilled -> the slot is promoted to required / identifier in a
          subsequent, deliberate migration. Proposing the first step only.

          NOT the same as walletAddress: that binds a semantic identity to a
          signing key and is absent for most entities. This is the identity
          itself.
        range: uriorcurie
      walletAddress:
        slot_uri: rfs:walletAddress
        description: >-
          On-chain wallet address (bech32 or hex) bridging semantic identity
          to signing capability. Used by the identity bridge to link KOI
          entity URIs to on-chain accounts for CLAMS and EAS interop.
        range: string

enums:
  EntityTypes:
    permissible_values:
      INDIVIDUAL:
        meaning: rfs:Individual
      ORGANIZATION:
        meaning: rfs:Organization
      COMMUNITY:
        meaning: rfs:Community
        description: >-
          A collective entity such as a community, cooperative, or indigenous
          group acting as a unified identity for claims and governance.
